name: CI
on: [push]
jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}

  js-build-freshness:
    name: JS Build Freshness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run js:build
      - name: Fail if committed assets/*.min.js are out of date
        run: |
          if ! git diff --quiet -- assets/; then
            echo "::error::assets/*.min.js is out of date with its assets/*.js source. Run 'npm run js:build' and commit the result."
            git diff -- assets/
            exit 1
          fi
